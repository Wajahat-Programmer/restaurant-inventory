appId: com.restaurantinventory
---
# Fresh install state. Debug builds fetch their bundle from Metro on launch.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "tab-stock"
    timeout: 120000
# The first-run tour offer sits at the top of Home and pushes other things down; the tour has its own test (14).
- tapOn:
    id: "guide-dismiss"
    optional: true
