appId: com.restaurantinventory
name: Add an item with opening stock
---
- runFlow: ../e2e-shared/launch.yaml
- assertVisible:
    id: "stock-empty"
- runFlow:
    file: ../e2e-shared/add-item.yaml
    env:
      NAME: Rice
      QTY: "2000"
      COST: "400"
- assertVisible: "2 kg"
- assertVisible: "Rs 400.00"
- assertVisible: "✓ In stock"
