appId: com.restaurantinventory
name: Stock in, issue, and over-issue guard
---
- launchApp:
    clearState: true
- assertVisible: "Restaurant Inventory"
- assertVisible:
    id: "stock-qty"
    text: "0 g"
- tapOn:
    id: "btn-stock-in"
- assertVisible:
    id: "stock-qty"
    text: "1000 g"
- assertVisible: "Value Rs 120.00"
- assertVisible: "✓ In stock"
- tapOn:
    id: "btn-issue"
- assertVisible:
    id: "stock-qty"
    text: "750 g"
- tapOn:
    id: "btn-issue"
- tapOn:
    id: "btn-issue"
- assertVisible:
    id: "stock-qty"
    text: "250 g"
- assertVisible: "⚠ Low"
- tapOn:
    id: "btn-issue"
- assertVisible:
    id: "stock-qty"
    text: "0 g"
- tapOn:
    id: "btn-issue"
- assertVisible:
    id: "stock-error"
    text: ".*Insufficient stock.*"
- assertVisible:
    id: "stock-qty"
    text: "0 g"
