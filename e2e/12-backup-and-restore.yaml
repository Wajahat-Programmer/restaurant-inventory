appId: com.restaurantinventory
name: Back up, change the data, restore, and the data is back
---
- runFlow: ../e2e-shared/launch.yaml
- runFlow:
    file: ../e2e-shared/add-item.yaml
    env:
      NAME: Rice
      QTY: "1000"
      COST: "100"
- runFlow:
    file: ../e2e-shared/goto-more.yaml
    env:
      DEST: settings
- tapOn:
    id: "open-data"
- scrollUntilVisible:
    element:
      id: "field-pass1"
- tapOn:
    id: "field-pass1"
- inputText: backup phrase one
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "field-pass2"
- tapOn:
    id: "field-pass2"
- inputText: backup phrase one
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "save-passphrase"
- tapOn:
    id: "save-passphrase"
# Wait for the note and the new button to settle before pressing it.
- extendedWaitUntil:
    visible:
      id: "backup-now"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "backup-now"
- waitForAnimationToEnd
- tapOn:
    id: "backup-now"
# Building the file does 100,000 rounds of key derivation in plain JavaScript.
# The file shows in the list when it is done (the note is above the visible area).
- extendedWaitUntil:
    visible: "restaurant-20.*"
    timeout: 300000
- back
- back
# Change the data after the backup.
- runFlow:
    file: ../e2e-shared/add-item.yaml
    env:
      NAME: Oil
      QTY: "500"
      COST: "50"
- assertVisible:
    id: "item-Oil"
# Restore the backup.
- runFlow:
    file: ../e2e-shared/goto-more.yaml
    env:
      DEST: settings
- tapOn:
    id: "open-data"
- scrollUntilVisible:
    element:
      id: "backups-list"
- tapOn:
    id: "backups-list"
- tapOn: "Restore"
- scrollUntilVisible:
    element:
      id: "field-restore-pass"
- tapOn:
    id: "field-restore-pass"
- inputText: backup phrase one
- hideKeyboard
- tapOn:
    id: "confirm-restore"
- extendedWaitUntil:
    notVisible:
      id: "restore-panel"
    timeout: 600000
- back
- back
- tapOn:
    id: "tab-stock"
- assertVisible:
    id: "item-Rice"
- assertNotVisible:
    id: "item-Oil"
