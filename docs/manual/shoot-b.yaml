appId: com.restaurantinventory
name: Manual screenshots, part B (more menu, money, reports, settings)
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-stock"
    timeout: 60000
- tapOn:
    id: "tab-more"
- extendedWaitUntil:
    visible:
      id: "menu-suppliers"
    timeout: 15000
- takeScreenshot: 11-more
- tapOn:
    id: "menu-suppliers"
- extendedWaitUntil:
    visible:
      id: "supplier-Al-Noor Traders"
    timeout: 15000
- takeScreenshot: 12-suppliers
- tapOn:
    id: "supplier-Al-Noor Traders"
- extendedWaitUntil:
    visible:
      id: "supplier-due"
    timeout: 15000
- takeScreenshot: 13-supplier-detail
- back
- back
- tapOn:
    id: "menu-recipes"
- extendedWaitUntil:
    visible:
      id: "recipe-Chicken Biryani"
    timeout: 15000
- takeScreenshot: 14-recipes
- tapOn:
    id: "recipe-Chicken Biryani"
- extendedWaitUntil:
    visible:
      id: "field-recipe-name"
    timeout: 15000
- takeScreenshot: 15-recipe-form
- scrollUntilVisible:
    element:
      id: "recipe-cost"
- takeScreenshot: 15b-recipe-cost
- back
- back
- tapOn:
    id: "menu-expenses"
- extendedWaitUntil:
    visible:
